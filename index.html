    }

    }
    .modal-backdrop {

    }

    }

      to { opacity: 1; }
    }
    @keyframes slideUp {

    // =========================================================================
    // 2. UTILITAIRES DATES, SEMAINES & SÉCURITÉ HTML
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getMondayOfWeek(offset = 0) {
      const now = new Date();
      const day = now.getDay(); // 0 = Dimanche, 1 = Lundi...
      const diffToMonday = day === 0 ? -6 : 1 - day;
      const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffToMonday + offset * 7);
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function formatWeekKey(mondayDate) {
      const y = mondayDate.getFullYear();
      const m = String(mondayDate.getMonth() + 1).padStart(2, '0');
      const d = String(mondayDate.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatShortDate(dateObj) {
      return dateObj.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
    }

    function getWeekLabel(offset) {
      const monday = getMondayOfWeek(offset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const rangeStr = `${formatShortDate(monday)} – ${formatShortDate(sunday)}`;
      if (offset === 0) return { title: 'Cette semaine', subtitle: rangeStr };
      if (offset === -1) return { title: 'Semaine dernière', subtitle: rangeStr };
      if (offset === 1) return { title: 'Semaine prochaine', subtitle: rangeStr };
      if (offset < -1) return { title: `Il y a ${Math.abs(offset)} semaines`, subtitle: rangeStr };
      return { title: `Dans ${offset} semaines`, subtitle: rangeStr };
    }

    function slugifyHousehold(raw) {
      const cleaned = (raw || '')
        .toLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9-_]/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      return cleaned || 'mon-foyer';
    }

    function translateFirebaseAuthError(code) {
      const map = {
        'auth/invalid-email': 'Adresse e-mail invalide.',
        'auth/user-disabled': 'Ce compte a été désactivé.',
        'auth/user-not-found': 'Aucun compte trouvé avec cet e-mail.',
        'auth/wrong-password': 'Mot de passe incorrect.',
        'auth/invalid-credential': 'E-mail ou mot de passe incorrect.',
        'auth/email-already-in-use': 'Un compte existe déjà avec cet e-mail.',
        'auth/weak-password': 'Le mot de passe doit contenir au moins 6 caractères.',
        'auth/popup-closed-by-user': 'Fenêtre de connexion Google fermée.',
        'auth/unauthorized-domain': 'Ajoutez votre domaine GitHub Pages dans Firebase → Authentication → Paramètres → Domaines autorisés.',
        'auth/operation-not-allowed': 'Activez E-mail/Mot de passe (ou Google) dans Firebase → Authentication → Sign-in method.'
      };
      return map[code] || `Erreur de connexion (${code || 'inconnue'}).`;
    }

    // =========================================================================
    // 3. ÉTAT GLOBAL DE L'APPLICATION
    // =========================================================================
    const state = {
      activeTab: 'planner',         // 'planner' | 'groceries' | 'recipes' | 'history'
      weekOffset: 0,                // 0 = semaine en cours, -1 = semaine passée, +1 = semaine suivante
      householdCode: 'mon-foyer',   // Code partagé entre les appareils du foyer
      syncMode: 'connecting',       // 'connecting' | 'auth-required' | 'cloud' | 'local-memory' | 'permission-denied' | 'error'
      syncErrorMsg: '',
      currentUser: null,
      authRequired: false,
      authMode: 'login',            // 'login' | 'register'
      authFeedback: null,
      authLoading: false,

      recipes: [],
      mealPlans: {},
      groceries: [],

      recipeSearch: '',
      recipeCategoryFilter: 'ALL',
      groceryHideChecked: false,

      notifications: {
        enabled: false,
        lunchAlertTime: '11:00',
        dinnerAlertTime: '18:00',
        notifiedSlots: {}
      }
    };

    let db = null;
    let auth = null;
    let isUsingExternalFirebase = false;
    let unsubRecipes = null;
    let unsubMealPlans = null;
    let unsubGroceries = null;
    let unsubNotifSettings = null;
    let exactNotifTimer = null;

    // =========================================================================
    // 4. INITIALISATION FIREBASE & AUTHENTIFICATION NON-ANONYME
    // =========================================================================
    async function initFirebase(customConfigObj = null) {
      try {
        updateSyncBadge('connecting');
        const explicitConfig = customConfigObj || DEFAULT_FIREBASE_CONFIG;
        isUsingExternalFirebase = Boolean(explicitConfig);
        let firebaseConfig = explicitConfig;

        if (!firebaseConfig && typeof __firebase_config !== 'undefined' && __firebase_config) {
          firebaseConfig = JSON.parse(__firebase_config);
        }

        // Si aucune configuration personnelle n'est définie et qu'aucun jeton sandbox n'est actif,
        // on démarre immédiatement en mode local fluide avec les 21 recettes chargées.
        if (!firebaseConfig || (!isUsingExternalFirebase && (typeof __initial_auth_token === 'undefined' || !__initial_auth_token))) {
          state.syncMode = 'local-memory';
          state.authRequired = false;
          updateSyncBadge('local');
          seedInMemoryDemoData();
          renderApp();
          return;
        }

        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (!isUsingExternalFirebase && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        }

        onAuthStateChanged(auth, (user) => {
          if (user) {
            state.currentUser = user;
            state.authRequired = false;
            state.authFeedback = null;
            updateAuthUserChip();
            attachFirestoreListeners();
            renderApp();
          } else {
            state.currentUser = null;
            state.authRequired = true;
            state.syncMode = 'auth-required';
            updateSyncBadge('auth-required');
            updateAuthUserChip();
            renderApp();
          }
        });
      } catch (err) {
        console.error('Erreur initialisation Firebase:', err);
        state.syncMode = 'local-memory';
        state.authRequired = false;
        updateSyncBadge('local');
        seedInMemoryDemoData();
        renderApp();
      }
    }

    function getHouseholdCollection(subName) {
      const code = state.householdCode || 'mon-foyer';
      if (!isUsingExternalFirebase && typeof __app_id !== 'undefined' && __app_id && state.currentUser) {
        return collection(db, 'artifacts', __app_id, 'users', state.currentUser.uid, `hh_${code}_${subName}`);
      }
      return collection(db, 'households', code, subName);
    }

    function getHouseholdDoc(subName, docId) {
      const code = state.householdCode || 'mon-foyer';
      if (!isUsingExternalFirebase && typeof __app_id !== 'undefined' && __app_id && state.currentUser) {
        return doc(db, 'artifacts', __app_id, 'users', state.currentUser.uid, `hh_${code}_${subName}`, docId);
      }
      return doc(db, 'households', code, subName, docId);
    }

    function handleFirestoreError(err) {
      const code = err?.code || '';
      const msg = err?.message || '';
      if (code === 'permission-denied' || msg.includes('Missing or insufficient permissions')) {
        state.syncMode = 'permission-denied';
        state.syncErrorMsg = 'Permissions Firestore insuffisantes.';
        updateSyncBadge('error');
        if (state.recipes.length === 0) {
          seedInMemoryDemoData();
        }
        renderApp();
      } else {
        console.error('Erreur Firestore:', err);
        showToast('Erreur de synchronisation Cloud.', 'error');
      }
    }

    function attachFirestoreListeners() {
      if (!db || !state.currentUser) return;

      if (unsubRecipes) unsubRecipes();
      if (unsubMealPlans) unsubMealPlans();
      if (unsubGroceries) unsubGroceries();
      if (unsubNotifSettings) unsubNotifSettings();

      const recipesCol = getHouseholdCollection('recipes');
      const mealPlansCol = getHouseholdCollection('mealPlans');
      const groceriesCol = getHouseholdCollection('groceries');

      let initialRecipesChecked = false;

      unsubRecipes = onSnapshot(
        recipesCol,
        async (snapshot) => {
          state.syncMode = 'cloud';
          state.syncErrorMsg = '';
          updateSyncBadge('cloud');

          if (snapshot.empty && !initialRecipesChecked) {
            initialRecipesChecked = true;
            try {
              for (const r of STARTER_RECIPES) {
                await setDoc(getHouseholdDoc('recipes', r.id), r);
              }
            } catch (writeErr) {
              handleFirestoreError(writeErr);
            }
            return;
          }
          initialRecipesChecked = true;

          state.recipes = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          renderApp();
        },
        (err) => handleFirestoreError(err)
      );

      unsubMealPlans = onSnapshot(
        mealPlansCol,
        (snapshot) => {
          const plans = {};
          snapshot.docs.forEach((d) => {
            plans[d.id] = d.data().slots || {};
          });
          state.mealPlans = plans;
          renderApp();
        },
        (err) => handleFirestoreError(err)
      );

      unsubGroceries = onSnapshot(
        groceriesCol,
        (snapshot) => {
          state.groceries = snapshot.docs.map((d) => ({ id: d.id, ...d.data() }));
          updateGroceryBadges();
          renderApp();
        },
        (err) => handleFirestoreError(err)
      );

      unsubNotifSettings = onSnapshot(
        getHouseholdDoc('settings', 'notifications'),
        (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            if (data.lunchAlertTime) state.notifications.lunchAlertTime = data.lunchAlertTime;
            if (data.dinnerAlertTime) state.notifications.dinnerAlertTime = data.dinnerAlertTime;
            persistLocalNotificationState();
            scheduleNextExactNotification();
          }
        },
        () => {}
      );
    }

    // =========================================================================
    // 5. OPÉRATIONS DE SAUVEGARDE (MÉMOIRE + CLOUD FIRESTORE)
    // =========================================================================
    async function saveMealSlotToCloud(weekKey, slotKey, mealData) {
      const currentSlots = { ...(state.mealPlans[weekKey] || {}) };
      if (mealData === null) {
        delete currentSlots[slotKey];
      } else {
        currentSlots[slotKey] = mealData;
      }
      state.mealPlans[weekKey] = currentSlots;
      renderApp();

      if (db && state.currentUser) {
        try {
          await setDoc(getHouseholdDoc('mealPlans', weekKey), { slots: currentSlots });
        } catch (err) {
          handleFirestoreError(err);
        }
      }
    }

    async function saveRecipeToCloud(recipe) {
      const id = recipe.id || 'rec-' + Date.now();
      const payload = { ...recipe, id };
      const idx = state.recipes.findIndex((r) => r.id === id);
      if (idx >= 0) {
        state.recipes[idx] = payload;
      } else {
        state.recipes.unshift(payload);
      }
      renderApp();

      if (db && state.currentUser) {
        try {
          await setDoc(getHouseholdDoc('recipes', id), payload);
        } catch (err) {
          handleFirestoreError(err);
        }
      }
    }

    async function deleteRecipeFromCloud(recipeId) {
      state.recipes = state.recipes.filter((r) => r.id !== recipeId);
      renderApp();

      if (db && state.currentUser) {
        try {
          await deleteDoc(getHouseholdDoc('recipes', recipeId));
        } catch (err) {
          handleFirestoreError(err);
        }
      }
    }

    async function loadUserStarterPack() {
      let addedCount = 0;
      const existingTitles = new Set(state.recipes.map((r) => r.title.toLowerCase().trim()));
      for (const r of STARTER_RECIPES) {
        if (!existingTitles.has(r.title.toLowerCase().trim())) {
          await saveRecipeToCloud(r);
          addedCount++;
        }
      }
      if (addedCount > 0) {
        showToast(`${addedCount} recette(s) habituelle(s) ajoutée(s) !`, 'success');
      } else {
        showToast('Toutes vos 21 recettes habituelles sont déjà présentes.', 'info');
      }
    }

    async function addGroceryItemToCloud(item) {
      const id = item.id || 'g-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      const payload = {
        id,
        name: item.name.trim(),
        qty: (item.qty || '').trim(),
        aisle: item.aisle || 'Boissons & Autre',
        checked: Boolean(item.checked)
      };
      state.groceries.push(payload);
      updateGroceryBadges();
      renderApp();

      if (db && state.currentUser) {
        try {
          await setDoc(getHouseholdDoc('groceries', id), payload);
        } catch (err) {
          handleFirestoreError(err);
        }
      }
    }

    async function toggleGroceryItemInCloud(itemId, checked) {
      const target = state.groceries.find((g) => g.id === itemId);
      if (!target) return;
      target.checked = checked;
      updateGroceryBadges();
      renderApp();

      if (db && state.currentUser) {
        try {
          await setDoc(getHouseholdDoc('groceries', itemId), { ...target });
        } catch (err) {
          handleFirestoreError(err);
        }
      }
    }

    async function deleteGroceryItemFromCloud(itemId) {
      state.groceries = state.groceries.filter((g) => g.id !== itemId);
      updateGroceryBadges();
      renderApp();

      if (db && state.currentUser) {
        try {
          await deleteDoc(getHouseholdDoc('groceries', itemId));
        } catch (err) {
          handleFirestoreError(err);
        }
      }
    }

    async function clearCheckedGroceriesFromCloud() {
      const toDelete = state.groceries.filter((g) => g.checked);
      if (toDelete.length === 0) return;
      state.groceries = state.groceries.filter((g) => !g.checked);
      updateGroceryBadges();
      renderApp();

      if (db && state.currentUser) {
        try {
          for (const item of toDelete) {
            await deleteDoc(getHouseholdDoc('groceries', item.id));
          }
        } catch (err) {
          handleFirestoreError(err);
        }
      }
      showToast(`${toDelete.length} article(s) acheté(s) retiré(s).`, 'info');
    }

    async function sendWeekIngredientsToGroceries() {
      const weekKey = formatWeekKey(getMondayOfWeek(state.weekOffset));
      const slots = state.mealPlans[weekKey] || {};
      const entries = Object.values(slots);
      if (entries.length === 0) {
        showToast('Aucun repas planifié sur cette semaine.', 'info');
        return;
      }

      const existingNames = new Set(state.groceries.filter((g) => !g.checked).map((g) => g.name.toLowerCase().trim()));
      let addedCount = 0;

      for (const meal of entries) {
        if (!meal.recipeId) continue;
        const recipe = state.recipes.find((r) => r.id === meal.recipeId);
        if (!recipe || !Array.isArray(recipe.ingredients)) continue;

        for (const ing of recipe.ingredients) {
          const norm = ing.name.toLowerCase().trim();
          if (!existingNames.has(norm)) {
            existingNames.add(norm);
            await addGroceryItemToCloud({
              name: ing.name,
              qty: ing.qty || '',
              aisle: ing.aisle || 'Boissons & Autre',
              checked: false
            });
            addedCount++;
          }
        }
      }

      if (addedCount > 0) {
        showToast(`${addedCount} ingrédient(s) ajouté(s) aux courses !`, 'success');
      } else {
        showToast('Tous les ingrédients de cette semaine sont déjà dans la liste.', 'info');
      }
    }

    // =========================================================================
    // 6. INDICATEURS UI & NOTIFICATIONS
    // =========================================================================
    function updateSyncBadge(mode) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('sync-label');
      if (!dot || !label) return;

      if (mode === 'cloud') {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        label.textContent = 'Synchronisé en direct';
      } else if (mode === 'auth-required') {
        dot.className = 'w-2 h-2 rounded-full bg-amber-500';
        label.textContent = 'Connexion requise';
      } else if (mode === 'local') {
        dot.className = 'w-2 h-2 rounded-full bg-sky-500';
        label.textContent = 'Mode local (prêt pour GitHub)';
      } else if (mode === 'error') {
        dot.className = 'w-2 h-2 rounded-full bg-red-500';
        label.textContent = 'Vérifier règles Firebase';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
        label.textContent = 'Connexion...';
      }
    }

    function updateAuthUserChip() {
      const chip = document.getElementById('auth-user-chip');
      const emailEl = document.getElementById('auth-user-email');
      if (!chip || !emailEl) return;

      if (isUsingExternalFirebase && state.currentUser && state.currentUser.email) {
        chip.classList.remove('hidden');
        chip.classList.add('flex');
        emailEl.textContent = state.currentUser.email;
      } else {
        chip.classList.add('hidden');
        chip.classList.remove('flex');

    function updateGroceryBadges() {
      const remaining = state.groceries.filter((g) => !g.checked).length;
      const dBadge = document.getElementById('nav-grocery-badge-desktop');
      const mBadge = document.getElementById('nav-grocery-badge-mobile');
      [dBadge, mBadge].forEach((b) => {
        if (!b) return;
        if (remaining > 0) {
          b.textContent = remaining;
          b.classList.remove('hidden');
        } else {
          b.classList.add('hidden');
        }
      });

    function updateNavActiveStates() {
      document.querySelectorAll('.nav-tab-btn').forEach((btn) => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = active
          ? 'nav-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white text-emerald-800 shadow-xs'
          : 'nav-tab-btn px-4 py-2 rounded-xl text-sm font-semibold transition-all text-stone-600 hover:text-stone-900 flex items-center gap-1.5';
      });
      document.querySelectorAll('.nav-tab-mobile').forEach((btn) => {
        const active = btn.dataset.tab === state.activeTab;
        btn.className = active
          ? 'nav-tab-mobile relative flex-1 py-1.5 rounded-xl flex flex-col items-center gap-0.5 text-[11px] font-bold text-emerald-700 bg-emerald-50/80'
          : 'nav-tab-mobile relative flex-1 py-1.5 rounded-xl flex flex-col items-center gap-0.5 text-[11px] font-medium text-stone-500';
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bg =
        type === 'error'
          ? 'bg-red-700 text-white'
          : type === 'info'
          ? 'bg-stone-800 text-white'
          : 'bg-emerald-700 text-white';
      toast.className = `${bg} px-4 py-3 rounded-2xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 pointer-events-auto modal-panel`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 3000);
    }

            </div>
            <div>
              <div class="flex items-center justify-between mb-1">

              </div>
              <input id="auth-password-input" type="password" required minlength="6" placeholder="6 caractères minimum" class="w-full px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
            </div>
            <button type="submit" ${state.authLoading ? 'disabled' : ''} class="w-full py-3 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-bold shadow-xs transition">
              ${state.authLoading ? 'Connexion en cours...' : isRegister ? 'Créer mon accès privé' : 'Accéder à mes menus'}
            </button>
          </form>

          <div class="relative flex items-center justify-center">
            <div class="border-t border-stone-200 w-full"></div>
            <span class="bg-white px-3 text-[11px] font-medium text-stone-400 uppercase">ou</span>
            <div class="border-t border-stone-200 w-full"></div>
          </div>

          <button type="button" id="auth-google-btn" class="w-full py-2.5 px-4 rounded-xl border border-stone-300 hover:bg-stone-50 text-stone-700 text-sm font-semibold flex items-center justify-center gap-2 transition">
            <span>Continuer avec Google</span>

    function bindAuthEvents() {
      document.getElementById('auth-tab-login')?.addEventListener('click', () => {
        state.authMode = 'login';
        state.authFeedback = null;
        renderApp();
      });
      document.getElementById('auth-tab-register')?.addEventListener('click', () => {
        state.authMode = 'register';
        state.authFeedback = null;
        renderApp();
      });

      document.getElementById('auth-email-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!auth) return;
        const email = document.getElementById('auth-email-input').value.trim();
        const password = document.getElementById('auth-password-input').value;
        state.authLoading = true;
        state.authFeedback = null;
        renderApp();

        try {
          if (state.authMode === 'register') {
            await createUserWithEmailAndPassword(auth, email, password);
          } else {
            await signInWithEmailAndPassword(auth, email, password);
          }
        } catch (err) {
          state.authFeedback = { type: 'error', message: translateFirebaseAuthError(err?.code) };
        } finally {
          state.authLoading = false;
          renderApp();
        }
      });

      document.getElementById('auth-forgot-btn')?.addEventListener('click', async () => {
        if (!auth) return;
        const email = document.getElementById('auth-email-input')?.value.trim();
        if (!email) {
          state.authFeedback = { type: 'error', message: 'Saisissez votre adresse e-mail ci-dessus puis cliquez sur Mot de passe oublié.' };
          renderApp();
          return;
        }
        try {
          await sendPasswordResetEmail(auth, email);
          state.authFeedback = { type: 'success', message: 'E-mail de réinitialisation envoyé ! Vérifiez votre boîte mail.' };
        } catch (err) {
          state.authFeedback = { type: 'error', message: translateFirebaseAuthError(err?.code) };
        }
        renderApp();
      });

      document.getElementById('auth-google-btn')?.addEventListener('click', async () => {
        if (!auth) return;
        try {
          const provider = new GoogleAuthProvider();
          await signInWithPopup(auth, provider);
        } catch (err) {
          state.authFeedback = { type: 'error', message: translateFirebaseAuthError(err?.code) };
          renderApp();
        }
      });
    }

    // =========================================================================
    // 8. VUE 1 : SEMAINIER (LUNDI -> DIMANCHE, MIDI & SOIR)
    // =========================================================================
    function renderPlannerView() {
      const monday = getMondayOfWeek(state.weekOffset);
      const weekKey = formatWeekKey(monday);
      const weekLabel = getWeekLabel(state.weekOffset);
      const slots = state.mealPlans[weekKey] || {};

      const totalPlanned = Object.keys(slots).length;
      const totalCooked = Object.values(slots).filter((s) => s.cooked).length;

      const dayCardsHtml = DAYS_OF_WEEK.map((dayName, dayIdx) => {
        const d = new Date(monday);
        d.setDate(monday.getDate() + dayIdx);
        const isToday = formatWeekKey(d) === formatWeekKey(new Date());

        const renderSlot = (period, periodLabel) => {
          const slotKey = `${dayIdx}-${period}`;
          const meal = slots[slotKey];

          if (!meal) {
            return `
              <button type="button" data-action="pick-meal" data-day="${dayIdx}" data-period="${period}"
                class="w-full text-left p-3 rounded-2xl border border-dashed border-stone-300 hover:border-emerald-500 hover:bg-emerald-50/50 transition group flex items-center justify-between gap-2">
                <div>
                  <span class="text-[11px] font-bold uppercase tracking-wider text-stone-400 group-hover:text-emerald-700">${periodLabel}</span>
                  <p class="text-xs text-stone-400 group-hover:text-stone-600 mt-0.5">+ Choisir un plat</p>
                </div>
                <span class="w-7 h-7 rounded-xl bg-stone-100 group-hover:bg-emerald-600 group-hover:text-white text-stone-500 flex items-center justify-center text-sm font-bold transition">+</span>
              </button>
            `;
          }

          return `
            <div class="p-3 rounded-2xl border ${meal.cooked ? 'bg-emerald-50/70 border-emerald-200' : 'bg-white border-stone-200 shadow-2xs'} transition">
              <div class="flex items-center justify-between gap-2 mb-1">
                <span class="text-[11px] font-bold uppercase tracking-wider ${meal.cooked ? 'text-emerald-700' : 'text-stone-400'}">${periodLabel}</span>
                <div class="flex items-center gap-1">
                  <button type="button" data-action="toggle-cooked" data-slot="${slotKey}" title="${meal.cooked ? 'Marqué comme mangé' : 'Marquer comme cuisiné / mangé'}"
                    class="px-2 py-0.5 rounded-lg text-[11px] font-bold transition ${
                      meal.cooked
                        ? 'bg-emerald-600 text-white'
                        : 'bg-stone-100 hover:bg-emerald-100 text-stone-600 hover:text-emerald-800'
                    }">
                    ${meal.cooked ? '✓ Mangé' : 'Valider'}
                  </button>
                  <button type="button" data-action="clear-slot" data-slot="${slotKey}" title="Retirer ce plat"
                    class="w-6 h-6 rounded-lg text-stone-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center text-xs font-bold">
                    ✕
                  </button>
                </div>
              </div>
              <button type="button" data-action="pick-meal" data-day="${dayIdx}" data-period="${period}"
                class="w-full text-left text-sm font-semibold ${meal.cooked ? 'text-emerald-950' : 'text-stone-800'} hover:text-emerald-700 leading-snug">
                ${escapeHtml(meal.title)}
              </button>
            </div>
          `;
        };

        return `
          <div class="bg-white rounded-3xl border ${isToday ? 'border-emerald-400 ring-2 ring-emerald-500/15' : 'border-stone-200/90'} p-4 flex flex-col gap-2.5 shadow-2xs">
            <div class="flex items-center justify-between pb-1 border-b border-stone-100">
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-sm text-stone-900">${dayName}</span>
                ${isToday ? '<span class="px-2 py-0.5 rounded-full bg-emerald-600 text-white text-[10px] font-bold">Aujourd’hui</span>' : ''}
              </div>
              <span class="text-xs font-medium text-stone-400">${formatShortDate(d)}</span>
            </div>
            ${renderSlot('lunch', 'Midi')}
            ${renderSlot('dinner', 'Soir')}
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-5">
          <!-- Barre de contrôle de la semaine -->
          <div class="bg-white rounded-3xl border border-stone-200 p-4 sm:p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4 shadow-2xs">
            <div class="flex items-center gap-3">
              <button type="button" id="prev-week-btn" class="w-10 h-10 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-700 flex items-center justify-center font-bold transition" title="Semaine précédente">
                ←
              </button>
              <div class="min-w-[175px]">
                <h2 class="text-base sm:text-lg font-extrabold text-stone-900">${weekLabel.title}</h2>
                <p class="text-xs text-stone-500 font-medium">${weekLabel.subtitle}</p>
              </div>
              <button type="button" id="next-week-btn" class="w-10 h-10 rounded-2xl bg-stone-100 hover:bg-stone-200 text-stone-700 flex items-center justify-center font-bold transition" title="Semaine suivante">
                →
              </button>
              ${state.weekOffset !== 0 ? '<button type="button" id="today-week-btn" class="px-3 py-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-xs font-semibold text-stone-700">Aujourd’hui</button>' : ''}
            </div>

            <div class="flex flex-wrap items-center gap-2.5">
              <div class="px-3.5 py-2 rounded-2xl bg-stone-100 text-xs font-semibold text-stone-700">
                ${totalPlanned} repas prévus · <span class="text-emerald-700 font-bold">${totalCooked} mangé(s)</span>
              </div>
              <button type="button" id="send-week-groceries-btn" class="px-4 py-2.5 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs sm:text-sm font-bold shadow-xs flex items-center gap-2 transition">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span>Ajouter les ingrédients aux courses</span>
              </button>
            </div>
          </div>

          <!-- Grille des 7 jours -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            ${dayCardsHtml}
          </div>
        </div>
      `;
    }

    function bindPlannerEvents() {
      const weekKey = formatWeekKey(getMondayOfWeek(state.weekOffset));

      document.getElementById('prev-week-btn')?.addEventListener('click', () => {
        state.weekOffset -= 1;
        renderApp();
      });
      document.getElementById('next-week-btn')?.addEventListener('click', () => {
        state.weekOffset += 1;
        renderApp();
      });
      document.getElementById('today-week-btn')?.addEventListener('click', () => {
        state.weekOffset = 0;
        renderApp();
      });
      document.getElementById('send-week-groceries-btn')?.addEventListener('click', sendWeekIngredientsToGroceries);

      document.querySelectorAll('[data-action="pick-meal"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          openMealPickerModal(Number(btn.dataset.day), btn.dataset.period);
        });
      });

      document.querySelectorAll('[data-action="toggle-cooked"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const slotKey = btn.dataset.slot;
          const current = state.mealPlans[weekKey]?.[slotKey];
          if (!current) return;
          await saveMealSlotToCloud(weekKey, slotKey, { ...current, cooked: !current.cooked });
        });
      });

      document.querySelectorAll('[data-action="clear-slot"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await saveMealSlotToCloud(weekKey, btn.dataset.slot, null);
        });
      });
    }

    // 9. VUE 2 : LISTE DE COURSES PAR RAYON
    // =========================================================================
    function renderGroceriesView() {
      const total = state.groceries.length;
      const checkedCount = state.groceries.filter((g) => g.checked).length;
      const pct = total > 0 ? Math.round((checkedCount / total) * 100) : 0;

      const visibleItems = state.groceryHideChecked
        ? state.groceries.filter((g) => !g.checked)
        : state.groceries;

      const aisleSections = AISLES.map((aisle) => {
        const items = visibleItems.filter((g) => (g.aisle || 'Boissons & Autre') === aisle);
        if (items.length === 0) return '';

        const itemsHtml = items
          .map(
            (item) => `
            <div class="flex items-center justify-between gap-3 p-3 rounded-2xl border ${
              item.checked ? 'bg-stone-50 border-stone-200/70 opacity-65' : 'bg-white border-stone-200'
            } transition">
              <button type="button" data-action="toggle-grocery" data-id="${escapeHtml(item.id)}" data-checked="${!item.checked}"
                class="flex items-center gap-3 flex-1 text-left min-w-0">
                <span class="w-6 h-6 rounded-xl border-2 flex items-center justify-center shrink-0 transition ${
                  item.checked
                    ? 'bg-emerald-600 border-emerald-600 text-white'
                    : 'border-stone-300 bg-white'

                  ${item.checked ? '✓' : ''}
                </span>
                <div class="min-w-0">
                  <p class="text-sm font-semibold truncate ${item.checked ? 'line-through text-stone-400' : 'text-stone-900'}">
                    ${escapeHtml(item.name)}

                  ${item.qty ? `<span class="text-xs text-stone-500">${escapeHtml(item.qty)}</span>` : ''}

              </button>
              <button type="button" data-action="delete-grocery" data-id="${escapeHtml(item.id)}"
                class="w-8 h-8 rounded-xl text-stone-400 hover:text-red-600 hover:bg-red-50 flex items-center justify-center text-xs font-bold shrink-0">
                ✕
              </button>
            </div>

        return `
          <div class="bg-white rounded-3xl border border-stone-200 p-4 space-y-2.5 shadow-2xs">
            <div class="flex items-center justify-between">
              <h3 class="text-xs font-extrabold uppercase tracking-wider text-emerald-800">${escapeHtml(aisle)}</h3>

      return `

    // =========================================================================
    // 11. VUE 4 : HISTORIQUE & TRAÇABILITÉ DES REPAS
    // =========================================================================
    function renderHistoryView() {
      const sortedWeeks = Object.keys(state.mealPlans).sort((a, b) => b.localeCompare(a));
      const dishCounts = {};
      const lastEatenMap = {};
      let totalMeals = 0;

      sortedWeeks.forEach((weekKey) => {
        const slots = state.mealPlans[weekKey] || {};
        Object.entries(slots).forEach(([slotKey, meal]) => {
          if (!meal || !meal.title) return;
          totalMeals++;
          const title = meal.title.trim();
          dishCounts[title] = (dishCounts[title] || 0) + 1;
          if (!lastEatenMap[title] || weekKey > lastEatenMap[title]) {
            lastEatenMap[title] = weekKey;
          }
        });
      });

      const topDishes = Object.entries(dishCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);
      const maxCount = topDishes.length > 0 ? topDishes[0][1] : 1;

      const neverOrOldRecipes = state.recipes
        .filter((r) => !lastEatenMap[r.title])
        .slice(0, 6);

      const timelineHtml = sortedWeeks
        .map((weekKey) => {
          const slots = state.mealPlans[weekKey] || {};
          const entries = Object.entries(slots);
          if (entries.length === 0) return '';

          const [y, m, d] = weekKey.split('-').map(Number);
          const monday = new Date(y, m - 1, d);
          const sunday = new Date(monday);
          sunday.setDate(monday.getDate() + 6);

          const orderedKeys = [];
          for (let day = 0; day < 7; day++) {
            orderedKeys.push(`${day}-lunch`, `${day}-dinner`);
          }

          const mealsList = orderedKeys
            .filter((k) => slots[k])
            .map((k) => {
              const [dayStr, period] = k.split('-');
              const meal = slots[k];
              return `
                <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-xl bg-stone-50 border border-stone-200/70 text-xs">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="font-bold text-stone-500 shrink-0">${DAYS_OF_WEEK[Number(dayStr)].slice(0, 3)}. ${period === 'lunch' ? 'Midi' : 'Soir'}</span>
                    <span class="font-semibold text-stone-900 truncate">${escapeHtml(meal.title)}</span>
                  </div>
                  <span class="shrink-0 font-bold ${meal.cooked ? 'text-emerald-700' : 'text-stone-400'}">
                    ${meal.cooked ? '✓ Mangé' : 'Prévu'}
                  </span>
                </div>
              `;
            })
            .join('');

          return `
            <div class="bg-white rounded-3xl border border-stone-200 p-4 sm:p-5 space-y-3 shadow-2xs">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-extrabold text-stone-900">
                  Semaine du ${formatShortDate(monday)} au ${formatShortDate(sunday)} ${y}
                </h3>
                <span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 text-xs font-bold">
                  ${entries.length} repas
                </span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${mealsList}</div>
            </div>
          `;
        })
        .join('');

      return `
        <div class="space-y-5">
          <!-- Statistiques globales -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white rounded-3xl border border-stone-200 p-5 shadow-2xs">
              <p class="text-xs font-bold uppercase tracking-wider text-stone-400">Repas enregistrés</p>
              <p class="text-3xl font-extrabold text-stone-900 mt-1">${totalMeals}</p>
            </div>
            <div class="bg-white rounded-3xl border border-stone-200 p-5 shadow-2xs">
              <p class="text-xs font-bold uppercase tracking-wider text-stone-400">Plats différents cuisinés</p>
              <p class="text-3xl font-extrabold text-emerald-700 mt-1">${Object.keys(dishCounts).length}</p>
            </div>
            <div class="bg-white rounded-3xl border border-stone-200 p-5 shadow-2xs">
              <p class="text-xs font-bold uppercase tracking-wider text-stone-400">Semaines suivies</p>
              <p class="text-3xl font-extrabold text-stone-900 mt-1">${sortedWeeks.length}</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <!-- Plats les plus fréquents -->
            <div class="bg-white rounded-3xl border border-stone-200 p-5 space-y-3 shadow-2xs">
              <h3 class="text-sm font-extrabold text-stone-900">Vos plats les plus fréquents</h3>
              ${
                topDishes.length === 0
                  ? '<p class="text-xs text-stone-400">Planifiez vos premiers repas pour voir vos statistiques ici.</p>'
                  : topDishes
                      .map(
                        ([title, count]) => `
                      <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold">
                          <span class="text-stone-800 truncate">${escapeHtml(title)}</span>
                          <span class="text-emerald-700 font-bold shrink-0">${count} fois</span>
                        </div>
                        <div class="w-full h-2 bg-stone-100 rounded-full overflow-hidden">
                          <div class="h-full bg-emerald-600 rounded-full" style="width: ${Math.round((count / maxCount) * 100)}%"></div>
                        </div>
                      </div>
                    `
                      )
                      .join('')
              }
            </div>

            <!-- Idées pas encore mangées récemment -->
            <div class="bg-white rounded-3xl border border-stone-200 p-5 space-y-3 shadow-2xs">
              <h3 class="text-sm font-extrabold text-stone-900">À cuisiner bientôt (pas encore au menu)</h3>
              <div class="flex flex-wrap gap-2">
                ${
                  neverOrOldRecipes.length === 0
                    ? '<p class="text-xs text-stone-400">Vous avez déjà goûté à toutes vos recettes !</p>'
                    : neverOrOldRecipes
                        .map(
                          (r) => `
                        <button type="button" data-action="history-quick-plan" data-id="${escapeHtml(r.id)}"
                          class="px-3 py-2 rounded-2xl bg-emerald-50 hover:bg-emerald-100 text-emerald-900 text-xs font-semibold border border-emerald-200/80 transition">
                          + ${escapeHtml(r.title)}
                        </button>
                      `
                        )
                        .join('')
                }
              </div>
            </div>
          </div>

          <!-- Chronologie semaine par semaine -->
          <div class="space-y-4">
            <h3 class="text-base font-extrabold text-stone-900 px-1">Chronologie des semaines</h3>
            ${
              timelineHtml ||
              '<div class="bg-white rounded-3xl border border-stone-200 p-8 text-center text-xs text-stone-500">Aucun historique enregistré pour le moment.</div>'
            }
          </div>
        </div>
      `;
    }

    function bindHistoryEvents() {
      document.querySelectorAll('[data-action="history-quick-plan"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const rec = state.recipes.find((r) => r.id === btn.dataset.id);
          if (rec) openQuickPlanRecipeModal(rec);
        });
      });
    }

    // =========================================================================
    // 12. FENÊTRES MODALES (CHOIX PLAT, ÉDITEUR RECETTE, SYNC GITHUB, PWA)

    function closeModal() {
      const container = document.getElementById('modal-container');
      if (container) container.innerHTML = '';
    }

    function openMealPickerModal(dayIdx, period) {
      const container = document.getElementById('modal-container');
      if (!container) return;
      const weekKey = formatWeekKey(getMondayOfWeek(state.weekOffset));
      const slotKey = `${dayIdx}-${period}`;
      const periodLabel = period === 'lunch' ? 'Midi' : 'Soir';

      const renderList = (filterText = '') => {
        const q = filterText.toLowerCase().trim();
        const matches = state.recipes.filter((r) => r.title.toLowerCase().includes(q));
        return matches
          .map(
            (r) => `
            <button type="button" data-pick-rec-id="${escapeHtml(r.id)}"

              <div>
                <p class="text-sm font-bold text-stone-900">${escapeHtml(r.title)}</p>

      container.innerHTML = `
        <div class="modal-backdrop fixed inset-0 z-50 bg-stone-900/50 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">

            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs font-bold uppercase text-emerald-700">${DAYS_OF_WEEK[dayIdx]} · ${periodLabel}</span>
                <h3 class="text-lg font-extrabold text-stone-900">Choisir un repas</h3>
              </div>
              <button type="button" id="close-modal-btn" class="w-9 h-9 rounded-xl bg-stone-100 hover:bg-stone-200 font-bold text-stone-600">✕</button>
            </div>

            <!-- Saisie libre rapide -->
            <form id="custom-meal-form" class="flex gap-2">
              <input id="custom-meal-input" type="text" placeholder="Ou écrire un plat libre (ex. Restes, Resto...)"
                class="flex-1 px-3.5 py-2.5 rounded-xl border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />
              <button type="submit" class="px-4 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-bold">OK</button>
            </form>

            <!-- Filtrer mes recettes -->
            <input id="picker-search-input" type="text" placeholder="Filtrer dans mes ${state.recipes.length} recettes..."
              class="w-full px-3.5 py-2 rounded-xl bg-stone-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500" />

            <div id="picker-recipes-list" class="flex-1 overflow-y-auto space-y-2 pr-1">
              ${renderList()}
            </div>
          </div>
        </div>
      `;

      const bindListClicks = () => {
        container.querySelectorAll('[data-pick-rec-id]').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const rec = state.recipes.find((r) => r.id === btn.dataset.pickRecId);
            if (!rec) return;
            await saveMealSlotToCloud(weekKey, slotKey, {
              title: rec.title,
              recipeId: rec.id,
              cooked: false
            });
            closeModal();
          });
        });
      };

      bindListClicks();
      document.getElementById('close-modal-btn')?.addEventListener('click', closeModal);
      document.getElementById('picker-search-input')?.addEventListener('input', (e) => {
        document.getElementById('picker-recipes-list').innerHTML = renderList(e.target.value);
        bindListClicks();
      });

      document.getElementById('custom-meal-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const val = document.getElementById('custom-meal-input').value.trim();
        if (!val) return;
        await saveMealSlotToCloud(weekKey, slotKey, {
          title: val,
          recipeId: null,
          cooked: false
        });
        closeModal();
      });
    }

    function openQuickPlanRecipeModal(recipe) {

      container.innerHTML = `

            </form>
          </div>
        </div>
      `;

      const rowsContainer = document.getElementById('ing-rows-container');

        rowsContainer.innerHTML = ingredients
          .map(
            (ing, idx) => `

              <input data-ing-idx="${idx}" data-field="name" type="text" value="${escapeHtml(ing.name)}" placeholder="Ingrédient"

    async function dispatchDeviceNotification(title, body) {
      showToast(`${title} — ${body}`, 'info');
      if (!('Notification' in window) || Notification.permission !== 'granted') return;

      const options = {
        body,
        tag: 'atelier-menu-repas-' + Date.now(),
        renotify: true,
        vibrate: [200, 100, 200]
      };

      try {
        if ('serviceWorker' in navigator) {
          const reg = await navigator.serviceWorker.getRegistration();
          if (reg && reg.showNotification) {
            await reg.showNotification(title, options);
            return;
          }
        }
        new Notification(title, options);
      } catch {}
    }

    function scheduleNextExactNotification() {
      if (exactNotifTimer) {
        clearTimeout(exactNotifTimer);
        exactNotifTimer = null;
      }
      const now = new Date();
      const candidates = [state.notifications.lunchAlertTime, state.notifications.dinnerAlertTime]
        .filter(Boolean)
        .map((timeStr) => {
          const [hh, mm] = timeStr.split(':').map(Number);
          const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 1, 0);
          if (target <= now) target.setDate(target.getDate() + 1);
          return target.getTime() - now.getTime();
        });

      if (candidates.length > 0) {
        exactNotifTimer = setTimeout(() => {
          checkMealNotifications();
          scheduleNextExactNotification();
        }, Math.min(...candidates));
      }
    }

    function checkMealNotifications() {
      if (!state.notifications.enabled) return;
      if ('Notification' in window && Notification.permission !== 'granted') return;

      const now = new Date();
      const todayKey = formatWeekKey(now);
      const currentWeekKey = formatWeekKey(getMondayOfWeek(0));
      const jsDay = now.getDay();
      const todayIdx = jsDay === 0 ? 6 : jsDay - 1;
      const nowMinutes = now.getHours() * 60 + now.getMinutes();

      const slots = state.mealPlans[currentWeekKey] || {};
      const checks = [
        { period: 'lunch', label: 'Midi', alertTime: state.notifications.lunchAlertTime || '11:00' },
        { period: 'dinner', label: 'Soir', alertTime: state.notifications.dinnerAlertTime || '18:00' }
      ];

      checks.forEach(({ period, label, alertTime }) => {
        const slotKey = `${todayIdx}-${period}`;
        const meal = slots[slotKey];
        if (!meal || !meal.title || meal.cooked) return;

        const [hStr, mStr] = alertTime.split(':');
        const triggerMinutes = Number(hStr) * 60 + Number(mStr);

        if (nowMinutes >= triggerMinutes && nowMinutes <= triggerMinutes + 90) {
          const uniqueKey = `${todayKey}-${slotKey}-${alertTime}`;
          if (state.notifications.notifiedSlots[uniqueKey]) return;

          state.notifications.notifiedSlots[uniqueKey] = true;
          persistLocalNotificationState();

          const recipe = meal.recipeId ? state.recipes.find((r) => r.id === meal.recipeId) : null;
          const ingSummary = recipe?.ingredients?.length
            ? ` (${recipe.ingredients.map((i) => i.name).join(', ')})`
            : '';

          dispatchDeviceNotification(
            `À cuisiner pour ce ${label.toLowerCase()} (${alertTime})`,
            `${meal.title}${ingSummary}`
          );
        }
      });
    }

    function exportWeekCalendarIcs() {
      const monday = getMondayOfWeek(state.weekOffset);
      const weekKey = formatWeekKey(monday);
      const slots = state.mealPlans[weekKey] || {};
      const entries = Object.entries(slots);

      if (entries.length === 0) {
        showToast('Aucun repas planifié sur cette semaine à exporter.', 'info');
        return;
      }

      const pad = (n) => String(n).padStart(2, '0');
      const toIcsDate = (d) =>
        `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;

      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Atelier Menu//Rappels Repas 11h 18h//FR',
        'CALSCALE:GREGORIAN'
      ];

      entries.forEach(([slotKey, meal]) => {
        if (!meal || !meal.title) return;
        const [dayStr, period] = slotKey.split('-');
        const dayIdx = Number(dayStr);
        const timeStr =
          period === 'lunch'
            ? state.notifications.lunchAlertTime || '11:00'
            : state.notifications.dinnerAlertTime || '18:00';
        const [hh, mm] = timeStr.split(':').map(Number);

        const start = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + dayIdx, hh, mm, 0);
        const end = new Date(start.getTime() + 30 * 60000);

        const recipe = meal.recipeId ? state.recipes.find((r) => r.id === meal.recipeId) : null;
        const desc = recipe?.ingredients?.length
          ? `Ingrédients : ${recipe.ingredients.map((i) => `${i.name}${i.qty ? ' (' + i.qty + ')' : ''}`).join(', ')}`
          : 'Repas planifié dans Atelier Menu';

        lines.push(
          'BEGIN:VEVENT',
          `UID:atelier-menu-${weekKey}-${slotKey}@github.io`,
          `DTSTAMP:${toIcsDate(new Date())}`,
          `DTSTART:${toIcsDate(start)}`,
          `DTEND:${toIcsDate(end)}`,
          `SUMMARY:À cuisiner (${period === 'lunch' ? 'Midi' : 'Soir'}) : ${meal.title}`,
          `DESCRIPTION:${desc.replace(/\n/g, ' ')}`,
          'BEGIN:VALARM',
          'TRIGGER:PT0S',
          'ACTION:DISPLAY',
          `DESCRIPTION:À cuisiner : ${meal.title}`,
          'END:VALARM',
          'END:VEVENT'
        );
      });

      lines.push('END:VCALENDAR');
      const blob = new Blob([lines.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `rappels-cuisine-${weekKey}.ics`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Rappels Calendrier (11h00 & 18h00) téléchargés !', 'success');
    }

      }
    });

    // Vérification régulière des rappels à 11h00 (Midi) et 18h00 (Soir)
    syncInitialNotificationPermission();
    setInterval(checkMealNotifications, 15000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkMealNotifications();
    });
    window.addEventListener('focus', checkMealNotifications);

    setupPwaAssets();
    initFirebase();
  </script>
</body>
</html>
