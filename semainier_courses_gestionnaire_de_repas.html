    // =========================================================================
    // 2. UTILITAIRES DE DATES (SEMAINES LUNDI -> DIMANCHE)
    // =========================================================================
    function getMonday(dateObj) {
      const d = new Date(dateObj);
      d.setHours(12, 0, 0, 0);
      const day = d.getDay(); // 0 = Dimanche, 1 = Lundi
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      d.setDate(diff);
      return d;
    }

    function addDays(dateObj, days) {
      const d = new Date(dateObj);
      d.setDate(d.getDate() + days);
      return d;
    }

    function toISODate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatShortDate(dateObj) {
      return `${dateObj.getDate()} ${MONTHS_SHORT_FR[dateObj.getMonth()]}`;
    }

    function formatWeekRange(mondayDate) {
      const sunday = addDays(mondayDate, 6);
      const sameMonth = mondayDate.getMonth() === sunday.getMonth();
      if (sameMonth) {
        return `Du ${mondayDate.getDate()} au ${sunday.getDate()} ${MONTHS_SHORT_FR[sunday.getMonth()]} ${sunday.getFullYear()}`;
      }
      return `Du ${formatShortDate(mondayDate)} au ${formatShortDate(sunday)} ${sunday.getFullYear()}`;
    }

    function getRelativeWeekLabel(weekOffset) {
      if (weekOffset === 0) return 'Cette semaine';
      if (weekOffset === -1) return 'Semaine dernière';
      if (weekOffset === 1) return 'Semaine prochaine';
      if (weekOffset < -1) return `Il y a ${Math.abs(weekOffset)} semaines`;
      return `Dans ${weekOffset} semaines`;
    }

    // =========================================================================
    // 3. ÉTAT APPLICATIF GLOBAL (EN MÉMOIRE + SYNCHRONISÉ CLOUD)
    // =========================================================================
    const currentMonday = getMonday(new Date());

    const state = {
      activeTab: 'planner',         // 'planner' | 'groceries' | 'recipes' | 'history'
      weekOffset: 0,                // 0 = semaine en cours, -1 = semaine passée, +1 = semaine suivante
      householdCode: 'mon-foyer',   // Code partagé entre tous les appareils du foyer
      syncMode: 'connecting',       // 'connecting' | 'cloud' | 'local-memory' | 'error'
      syncErrorMsg: '',
      currentUser: null,

      // Collections synchronisées
      recipes: [],                  // Liste des recettes du foyer
      mealPlans: {},                // Map { weekKey: { weekKey, householdCode, slots: { "YYYY-MM-DD_midi": {...} } } }
      groceries: [],                // Liste des articles de courses

      // Filtres UI
      recipeSearch: '',
      recipeCategoryFilter: 'Toutes',
      groceryFilter: 'all',         // 'all' | 'todo' | 'done'
      deleteConfirmId: null,        // Pour confirmation de suppression sans window.confirm()
      clearCheckedConfirm: false
    };

    // Références Firebase
    let db = null;
    let auth = null;
    let appId = typeof __app_id !== 'undefined' ? __app_id : 'atelier-menu-app';
    let unsubRecipes = null;
    let unsubMealPlans = null;
    let unsubGroceries = null;
    let seedAttemptedForHousehold = new Set();

    // =========================================================================
    // 4. INITIALISATION FIREBASE & SYNCHRONISATION TEMPS RÉEL
    // =========================================================================
    async function initCloudSync(customConfigObj = null) {
      try {
        updateSyncBadge('connecting');
        let firebaseConfig = customConfigObj;

        if (!firebaseConfig && typeof __firebase_config !== 'undefined' && __firebase_config) {
          firebaseConfig = JSON.parse(__firebase_config);
        }

        if (!firebaseConfig || !firebaseConfig.apiKey) {
          // Mode autonome en mémoire (par ex. si ouvert brut hors configuration Firebase)
          state.syncMode = 'local-memory';
          updateSyncBadge('local-memory');
          seedInMemoryDemoData();
          renderApp();
          return;
        }

        const firebaseApp = initializeApp(firebaseConfig);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);

        // RÈGLE 3 : Authentification AVANT toute requête Firestore
        if (!customConfigObj && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (user) => {
          state.currentUser = user;
          if (user) {
            attachFirestoreListeners();
          }
        });
      } catch (err) {
        console.error('Erreur initialisation sync:', err);
        state.syncMode = 'error';
        state.syncErrorMsg = err.message || 'Erreur de connexion';
        updateSyncBadge('error');
        if (state.recipes.length === 0) {
          seedInMemoryDemoData();
        }
        renderApp();
      }
    }

    function attachFirestoreListeners() {
      if (!db || !state.currentUser) return;

      // Nettoyer d'éventuels anciens écouteurs
      if (unsubRecipes) unsubRecipes();
      if (unsubMealPlans) unsubMealPlans();
      if (unsubGroceries) unsubGroceries();

      // RÈGLE 1 : Chemins stricts /artifacts/{appId}/public/data/{collectionName}
      // RÈGLE 2 : Pas de requêtes complexes where/orderBy -> filtrage et tri en mémoire JS
      const recipesCol = collection(db, 'artifacts', appId, 'public', 'data', 'recipes');
      const plansCol = collection(db, 'artifacts', appId, 'public', 'data', 'mealPlans');
      const groceriesCol = collection(db, 'artifacts', appId, 'public', 'data', 'groceries');

      unsubRecipes = onSnapshot(
        recipesCol,
        (snapshot) => {
          const allRecipes = [];
          snapshot.forEach((docSnap) => {
            allRecipes.push({ id: docSnap.id, ...docSnap.data() });
          });
          // Filtrer par foyer actif
          const householdRecipes = allRecipes
            .filter((r) => (r.householdCode || 'mon-foyer') === state.householdCode)
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

          state.recipes = householdRecipes;
          state.syncMode = 'cloud';
          updateSyncBadge('cloud');

          // Si le foyer est tout neuf et vide, injecter les recettes de départ de façon idempotente
          if (householdRecipes.length === 0 && !seedAttemptedForHousehold.has(state.householdCode)) {
            seedAttemptedForHousehold.add(state.householdCode);
            seedCloudStarterData(state.householdCode);
          }

          renderApp();
        },
        (error) => {
          console.error('Erreur snapshot recipes:', error);
          state.syncMode = 'error';
          state.syncErrorMsg = error.message;
          updateSyncBadge('error');
        }
      );

      unsubMealPlans = onSnapshot(
        plansCol,
        (snapshot) => {
          const plansMap = {};
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if ((data.householdCode || 'mon-foyer') === state.householdCode && data.weekKey) {
              plansMap[data.weekKey] = { id: docSnap.id, ...data };
            }
          });
          state.mealPlans = plansMap;
          renderApp();
        },
        (error) => {
          console.error('Erreur snapshot mealPlans:', error);
        }
      );

      unsubGroceries = onSnapshot(
        groceriesCol,
        (snapshot) => {
          const items = [];
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if ((data.householdCode || 'mon-foyer') === state.householdCode) {
              items.push({ id: docSnap.id, ...data });
            }
          });
          items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state.groceries = items;
          updateGroceryBadges();
          renderApp();
        },
        (error) => {
          console.error('Erreur snapshot groceries:', error);
        }
      );
    }

    async function loadUserStarterPack(replaceExisting = false) {
      const existingTitles = new Set(state.recipes.map((r) => r.title.toLowerCase().trim()));
      const now = Date.now();

      if (replaceExisting && db && state.currentUser && state.syncMode === 'cloud') {
        for (const r of state.recipes) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', r.id));
        }
      } else if (replaceExisting) {
        state.recipes = [];
      }

      let added = 0;
      for (let i = 0; i < STARTER_RECIPES.length; i++) {
        const r = STARTER_RECIPES[i];
        if (!replaceExisting && existingTitles.has(r.title.toLowerCase().trim())) continue;

        const docId = `${state.householdCode}_recipe_${r.slug}`;
        const payload = {
          householdCode: state.householdCode,
          title: r.title,
          category: r.category,
          prepTime: r.prepTime,
          notes: r.notes,
          ingredients: r.ingredients,
          createdAt: now - i * 1000
        };

        if (db && state.currentUser && state.syncMode === 'cloud') {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'recipes', docId), payload);
        } else {
          state.recipes.push({ id: docId, ...payload });
        }
        added++;
      }

      renderApp();
      showToast(
        replaceExisting
          ? `Carnet remplacé par vos ${STARTER_RECIPES.length} recettes habituelles !`
          : added > 0
          ? `${added} recette(s) ajoutée(s) à votre carnet !`
          : 'Toutes vos 21 recettes sont déjà présentes.',
        'success'
      );
    }

    // =========================================================================
    // 5. OPÉRATIONS DE DONNÉES (CRUD SYNCHRONISÉ)
    // =========================================================================
    async function saveMealSlot(weekKey, slotKey, mealData) {
      const existingPlan = state.mealPlans[weekKey] || {
        householdCode: state.householdCode,
        weekKey,
        slots: {}
      };
      const updatedSlots = { ...(existingPlan.slots || {}) };

      if (mealData === null) {
        delete updatedSlots[slotKey];
      } else {
        updatedSlots[slotKey] = mealData;
      }

      // Mise à jour optimiste immédiate
      state.mealPlans[weekKey] = {
        ...existingPlan,
        slots: updatedSlots,
        updatedAt: Date.now()
      };
      renderApp();

      if (db && state.currentUser && state.syncMode === 'cloud') {
        try {
          const docId = `${state.householdCode}_${weekKey}`;
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'mealPlans', docId), {
            householdCode: state.householdCode,
            weekKey,
            slots: updatedSlots,
            updatedAt: Date.now()
          });
        } catch (err) {
          console.error('Erreur sauvegarde repas:', err);
          showToast('Erreur de synchronisation du repas', 'error');
        }
      }
    }

        householdCode: state.householdCode,

      if (db && state.currentUser && state.syncMode === 'cloud') {

    async function addGroceryItem({ name, qty, category, fromMeal = '' }) {
      const cleanName = (name || '').trim();
      if (!cleanName) return;

      // Vérifier si un article non coché porte déjà le même nom pour éviter les doublons inutiles
      const existing = state.groceries.find(
        (g) => !g.checked && g.name.toLowerCase() === cleanName.toLowerCase()
      );

      if (existing) {
        const combinedQty = existing.qty && qty ? `${existing.qty} + ${qty}` : (qty || existing.qty || '');
        const updated = {
          ...existing,
          qty: combinedQty,
          fromMeal: fromMeal ? (existing.fromMeal ? `${existing.fromMeal}, ${fromMeal}` : fromMeal) : existing.fromMeal
        };
        if (db && state.currentUser && state.syncMode === 'cloud') {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groceries', existing.id), updated);
        } else {
          Object.assign(existing, updated);
          updateGroceryBadges();
          renderApp();
        }
        return;
      }

      const id = `${state.householdCode}_groc_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      const payload = {
        householdCode: state.householdCode,
        name: cleanName,
        qty: (qty || '').trim(),
        category: category || 'Épicerie',
        checked: false,
        fromMeal,
        createdAt: Date.now()
      };

      if (db && state.currentUser && state.syncMode === 'cloud') {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'groceries', id), payload);
        } catch (err) {
          console.error('Erreur ajout article course:', err);
        }
      } else {
        state.groceries.unshift({ id, ...payload });
        updateGroceryBadges();
        renderApp();
      }
    }

    async function sendWeekIngredientsToGroceries(weekKey) {
      const plan = state.mealPlans[weekKey];
      if (!plan || !plan.slots) {
        showToast('Aucun repas planifié cette semaine.', 'info');
        return;
      }

      const slotValues = Object.values(plan.slots);
      if (slotValues.length === 0) {
        showToast('Planifiez au moins un repas avant de générer les courses.', 'info');
        return;
      }

      let addedCount = 0;
      for (const slot of slotValues) {
        if (slot.recipeId) {
          const recipe = state.recipes.find((r) => r.id === slot.recipeId);
          if (recipe && Array.isArray(recipe.ingredients)) {
            for (const ing of recipe.ingredients) {
              await addGroceryItem({
                name: ing.name,
                qty: ing.qty,
                category: ing.category || 'Épicerie',
                fromMeal: recipe.title
              });
              addedCount++;
            }
          }
        }
      }

      if (addedCount > 0) {
        showToast(`${addedCount} ingrédient(s) ajouté(s) à votre liste de courses !`, 'success');
      } else {
        showToast('Les plats choisis n’ont pas d’ingrédients renseignés.', 'info');
      }
    }

    // =========================================================================
    // 6. ANALYSE DE L'HISTORIQUE (TRACABILITÉ DES SEMAINES PRÉCÉDENTES)
    // =========================================================================
    function getRecipeLastEatenInfo(recipeId, recipeTitle) {
      const todayISO = toISODate(new Date());
      let latestDateISO = null;
      let count = 0;

      Object.values(state.mealPlans).forEach((plan) => {
        if (!plan.slots) return;
        Object.entries(plan.slots).forEach(([slotKey, meal]) => {
          const dateISO = slotKey.split('_')[0];
          const matches =
            (recipeId && meal.recipeId === recipeId) ||
            (recipeTitle && meal.title && meal.title.toLowerCase() === recipeTitle.toLowerCase());

          if (matches && dateISO <= todayISO) {
            count++;
            if (!latestDateISO || dateISO > latestDateISO) {
              latestDateISO = dateISO;
            }
          }
        });
      });

      if (!latestDateISO) {
        return { label: 'Jamais mangé récemment', count: 0, daysAgo: Infinity };
      }

      const d1 = new Date(latestDateISO + 'T12:00:00');
      const d2 = new Date(todayISO + 'T12:00:00');
      const diffDays = Math.round((d2 - d1) / (1000 * 60 * 60 * 24));

      let label = '';
      if (diffDays === 0) label = "Mangé aujourd'hui";
      else if (diffDays === 1) label = 'Mangé hier';
      else if (diffDays < 7) label = `Mangé il y a ${diffDays} jours`;
      else {
        const weeks = Math.floor(diffDays / 7);
        label = weeks === 1 ? 'Mangé la semaine dernière' : `Mangé il y a ${weeks} semaines`;
      }

      return { label, count, daysAgo: diffDays, latestDateISO };
    }

    // =========================================================================
    // 7. INTERFACE UTILISATEUR : MISE À JOUR BADGES, TOASTS & NAVIGATION
    // =========================================================================
    function updateSyncBadge(mode) {
      const dot = document.getElementById('sync-dot');
      const label = document.getElementById('header-household-label');
      if (label) label.textContent = state.householdCode;
      if (!dot) return;

      dot.className = 'w-2.5 h-2.5 rounded-full ';
      if (mode === 'cloud') {
        dot.className += 'bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]';
      } else if (mode === 'connecting') {
        dot.className += 'bg-amber-400 animate-pulse';
      } else if (mode === 'local-memory') {
        dot.className += 'bg-sky-500';
      } else {
        dot.className += 'bg-rose-500';
      }
    }

    function updateGroceryBadges() {
      const remaining = state.groceries.filter((g) => !g.checked).length;
      const dBadge = document.getElementById('desktop-grocery-badge');
      const mBadge = document.getElementById('mobile-grocery-badge');

      [dBadge, mBadge].forEach((el) => {
        if (!el) return;
        if (remaining > 0) {
          el.textContent = remaining;
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
    }

    function updateNavActiveStates() {
      document.querySelectorAll('.nav-btn').forEach((btn) => {
        const isActive = btn.dataset.tab === state.activeTab;
        btn.className = isActive
          ? 'nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 bg-white text-emerald-700 shadow-sm'
          : 'nav-btn px-4 py-2 rounded-lg text-sm font-semibold transition-all flex items-center gap-2 text-stone-600 hover:text-stone-900';
      });

      document.querySelectorAll('.mobile-nav-btn').forEach((btn) => {
        const isActive = btn.dataset.tab === state.activeTab;
        btn.className = isActive
          ? 'mobile-nav-btn relative flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-semibold text-emerald-700 bg-emerald-50/80 transition-colors'
          : 'mobile-nav-btn relative flex flex-col items-center justify-center py-2 px-1 rounded-xl text-xs font-medium text-stone-500 hover:text-stone-800 transition-colors';
      });
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const toast = document.createElement('div');
      const bgColors = {
        success: 'bg-stone-900 text-white border-stone-800',
        info: 'bg-white text-stone-800 border-stone-200',
        error: 'bg-rose-600 text-white border-rose-700'
      };
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-lg border text-sm font-medium flex items-center gap-2.5 animate-fade-up max-w-sm ${bgColors[type] || bgColors.success}`;

      const icon = type === 'success'
        ? '<span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>'
        : type === 'error'
        ? '<span class="w-2 h-2 rounded-full bg-white shrink-0"></span>'
        : '<span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>';

      toast.innerHTML = `${icon}<span>${escapeHTML(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(6px)';
        toast.style.transition = 'all 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 3000);
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================================
    // 8. RENDU DES 4 VUES PRINCIPALES
    // =========================================================================
    function renderApp() {
      updateNavActiveStates();
      const root = document.getElementById('app-content');
      if (!root) return;

      if (state.activeTab === 'planner') {
        root.innerHTML = renderPlannerView();
        bindPlannerEvents();
      } else if (state.activeTab === 'groceries') {
        root.innerHTML = renderGroceriesView();
        bindGroceriesEvents();
      } else if (state.activeTab === 'recipes') {
        root.innerHTML = renderRecipesView();
        bindRecipesEvents();
      } else if (state.activeTab === 'history') {
        root.innerHTML = renderHistoryView();
        bindHistoryEvents();
      }
    }

    // -------------------------------------------------------------------------
    // VUE 1 : SEMAINIER (PLANNING DES REPAS LUNDI -> DIMANCHE)
    // -------------------------------------------------------------------------
    function renderPlannerView() {
      const targetMonday = addDays(currentMonday, state.weekOffset * 7);
      const weekKey = toISODate(targetMonday);
      const weekPlan = state.mealPlans[weekKey] || { slots: {} };
      const slots = weekPlan.slots || {};
      const todayISO = toISODate(new Date());

      const plannedCount = Object.keys(slots).length;
      const isPastWeek = state.weekOffset < 0;

      let daysHTML = '';
      for (let i = 0; i < 7; i++) {
        const dayDate = addDays(targetMonday, i);
        const dayISO = toISODate(dayDate);
        const isToday = dayISO === todayISO;
        const midiKey = `${dayISO}_midi`;
        const soirKey = `${dayISO}_soir`;
        const midiMeal = slots[midiKey];
        const soirMeal = slots[soirKey];

        daysHTML += `
          <div class="bg-white rounded-2xl border ${isToday ? 'border-emerald-500 ring-2 ring-emerald-500/15' : 'border-stone-200/80'} p-4 sm:p-5 shadow-xs transition-all">
            <div class="flex flex-col lg:flex-row lg:items-center gap-4">
              <!-- Colonne Jour -->
              <div class="lg:w-44 shrink-0 flex items-center justify-between lg:block">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-stone-900 text-base">${DAYS_FR[i]}</span>
                    ${isToday ? '<span class="px-2 py-0.5 text-[11px] font-bold uppercase tracking-wider rounded-full bg-emerald-100 text-emerald-800">Aujourd’hui</span>' : ''}
                  </div>
                  <p class="text-xs sm:text-sm text-stone-500 mt-0.5">${formatShortDate(dayDate)}</p>
                </div>
              </div>

              <!-- Créneaux Midi & Soir -->
              <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${renderMealSlotCard(weekKey, midiKey, 'Midi', midiMeal)}
                ${renderMealSlotCard(weekKey, soirKey, 'Soir', soirMeal)}
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-5 animate-fade-up">
          <!-- Barre de contrôle de semaine -->
          <div class="bg-white rounded-2xl border border-stone-200/80 p-4 sm:p-5 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center justify-between sm:justify-start gap-3">
              <button id="prev-week-btn" class="p-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors" title="Semaine précédente">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
              </button>

              <div class="text-center sm:text-left">
                <div class="flex items-center justify-center sm:justify-start gap-2">
                  <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded-full ${
                    state.weekOffset === 0
                      ? 'bg-emerald-100 text-emerald-800'
                      : isPastWeek
                      ? 'bg-amber-100 text-amber-800'
                      : 'bg-sky-100 text-sky-800'
                  }">${getRelativeWeekLabel(state.weekOffset)}</span>
                  ${state.weekOffset !== 0 ? '<button id="today-week-btn" class="text-xs font-semibold text-emerald-700 hover:underline">Revenir à aujourd’hui</button>' : ''}
                </div>
                <h2 class="text-lg sm:text-xl font-bold text-stone-900 mt-1">${formatWeekRange(targetMonday)}</h2>
              </div>

              <button id="next-week-btn" class="p-2.5 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-700 transition-colors" title="Semaine suivante">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
              </button>
            </div>

            <!-- Action rapide Courses -->
            <div class="flex items-center gap-2.5">
              <button id="generate-groceries-btn" data-week="${weekKey}" class="w-full sm:w-auto px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white text-sm font-semibold shadow-xs transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span>Ajouter aux courses (${plannedCount} repas)</span>
              </button>
            </div>
          </div>

          ${isPastWeek ? `
            <div class="bg-amber-50/90 border border-amber-200/80 rounded-2xl px-4 py-3 text-xs sm:text-sm text-amber-900 flex items-center gap-2.5">
              <svg class="w-5 h-5 text-amber-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
              <span>Vous consultez une <strong>semaine précédente</strong>. Tous les plats enregistrés ici sont automatiquement tracés dans votre historique.</span>
            </div>
          ` : ''}

          <!-- Liste des 7 jours -->
          <div class="space-y-3">
            ${daysHTML}
          </div>
        </div>
      `;
    }

    function renderMealSlotCard(weekKey, slotKey, periodLabel, meal) {
      if (!meal) {
        return `
          <button
            data-action="open-meal-picker"
            data-week="${weekKey}"
            data-slot="${slotKey}"
            data-period="${periodLabel}"
            class="group w-full text-left p-3.5 rounded-xl border border-dashed border-stone-300 hover:border-emerald-500 hover:bg-emerald-50/40 transition-all flex items-center justify-between gap-2 min-h-[68px]"
          >
            <div>
              <span class="text-[11px] font-bold uppercase tracking-wider text-stone-400 group-hover:text-emerald-700">${periodLabel}</span>
              <p class="text-sm text-stone-400 group-hover:text-emerald-800 font-medium mt-0.5">+ Choisir un plat</p>
            </div>
            <span class="w-7 h-7 rounded-lg bg-stone-100 group-hover:bg-emerald-600 group-hover:text-white text-stone-500 flex items-center justify-center transition-colors text-lg font-medium">+</span>
          </button>
        `;
      }

      const linkedRecipe = meal.recipeId ? state.recipes.find((r) => r.id === meal.recipeId) : null;

      return `
        <div class="p-3.5 rounded-xl border ${meal.cooked ? 'bg-emerald-50/50 border-emerald-200' : 'bg-stone-50/80 border-stone-200/90'} flex items-start justify-between gap-2.5 min-h-[68px] transition-all">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2">
              <span class="text-[11px] font-bold uppercase tracking-wider ${periodLabel === 'Midi' ? 'text-amber-600' : 'text-indigo-600'}">${periodLabel}</span>
              ${meal.cooked ? '<span class="text-[11px] font-semibold text-emerald-700 bg-emerald-100 px-1.5 py-0.2 rounded-md">Mangé ✓</span>' : ''}
            </div>
            <button
              data-action="open-meal-picker"
              data-week="${weekKey}"
              data-slot="${slotKey}"
              data-period="${periodLabel}"
              class="text-left font-semibold text-sm text-stone-900 hover:text-emerald-700 line-clamp-2 mt-0.5 transition-colors"
            >
              ${escapeHTML(meal.title)}
            </button>
            ${linkedRecipe ? `<p class="text-[11px] text-stone-500 mt-0.5">${linkedRecipe.ingredients?.length || 0} ingrédients · ${linkedRecipe.prepTime} min</p>` : ''}
          </div>

          <div class="flex items-center gap-1 shrink-0">
            <button
              data-action="toggle-cooked"
              data-week="${weekKey}"
              data-slot="${slotKey}"
              title="${meal.cooked ? 'Marquer comme non préparé' : 'Marquer comme cuisiné / mangé'}"
              class="p-1.5 rounded-lg border transition-colors ${
                meal.cooked
                  ? 'bg-emerald-600 border-emerald-600 text-white'
                  : 'bg-white border-stone-200 text-stone-400 hover:text-emerald-600 hover:border-emerald-400'
              }"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>
            </button>
            <button
              data-action="remove-meal"
              data-week="${weekKey}"
              data-slot="${slotKey}"
              title="Retirer ce repas"
              class="p-1.5 rounded-lg bg-white border border-stone-200 text-stone-400 hover:text-rose-600 hover:border-rose-300 transition-colors"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // VUE 2 : LISTE DE COURSES INTELLIGENTE
    // -------------------------------------------------------------------------
    function renderGroceriesView() {
      const total = state.groceries.length;
      const checkedCount = state.groceries.filter((g) => g.checked).length;
      const todoCount = total - checkedCount;
      const progressPct = total > 0 ? Math.round((checkedCount / total) * 100) : 0;

      const filtered = state.groceries.filter((item) => {
        if (state.groceryFilter === 'todo') return !item.checked;
        if (state.groceryFilter === 'done') return item.checked;
        return true;
      });

      // Grouper par rayon / catégorie
      const grouped = {};
      GROCERY_CATEGORIES.forEach((cat) => (grouped[cat] = []));
      filtered.forEach((item) => {
        const cat = GROCERY_CATEGORIES.includes(item.category) ? item.category : 'Maison & Autre';
        grouped[cat].push(item);
      });

      let categoriesHTML = '';
      GROCERY_CATEGORIES.forEach((cat) => {
        const items = grouped[cat];
        if (items.length === 0) return;

        categoriesHTML += `
          <div class="bg-white rounded-2xl border border-stone-200/80 overflow-hidden shadow-xs">
            <div class="px-4 py-2.5 bg-stone-50/90 border-b border-stone-200/70 flex items-center justify-between">
              <h3 class="text-xs font-bold uppercase tracking-wider text-stone-600">${escapeHTML(cat)}</h3>
              <span class="text-xs font-semibold text-stone-400">${items.length}</span>
            </div>
            <ul class="divide-y divide-stone-100">
              ${items
                .map(
                  (item) => `
                <li class="px-4 py-3 flex items-center justify-between gap-3 hover:bg-stone-50/60 transition-colors">
                  <button data-action="toggle-grocery" data-id="${item.id}" class="flex items-center gap-3 flex-1 text-left min-w-0">
                    <span class="w-6 h-6 rounded-lg border-2 flex items-center justify-center shrink-0 transition-colors ${
                      item.checked
                        ? 'bg-emerald-600 border-emerald-600 text-white'
                        : 'border-stone-300 bg-white'
                    }">
                      ${item.checked ? '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>' : ''}
                    </span>
                    <div class="min-w-0 flex-1">
                      <p class="text-sm font-medium ${item.checked ? 'line-through text-stone-400' : 'text-stone-900'} truncate">
                        ${escapeHTML(item.name)}
                        ${item.qty ? `<span class="ml-1.5 text-xs font-semibold px-2 py-0.5 rounded-md ${item.checked ? 'bg-stone-100 text-stone-400' : 'bg-emerald-50 text-emerald-700'}">${escapeHTML(item.qty)}</span>` : ''}
                      </p>
                      ${item.fromMeal ? `<p class="text-[11px] text-stone-400 truncate mt-0.5">Pour : ${escapeHTML(item.fromMeal)}</p>` : ''}
                    </div>
                  </button>
                  <button data-action="delete-grocery" data-id="${item.id}" class="p-2 text-stone-400 hover:text-rose-600 rounded-lg transition-colors" title="Supprimer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                  </button>
                </li>
              `
                )
                .join('')}
            </ul>
          </div>
        `;
      });

      return `
        <div class="space-y-5 animate-fade-up">
          <!-- En-tête & Barre de progression -->
          <div class="bg-white rounded-2xl border border-stone-200/80 p-4 sm:p-5 shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-xl font-bold text-stone-900">Liste de courses partagée</h2>
                <p class="text-xs sm:text-sm text-stone-500 mt-0.5">
                  ${todoCount} article(s) à acheter · ${checkedCount} dans le panier
                </p>
              </div>
              <div class="flex items-center gap-2">
                ${
                  checkedCount > 0
                    ? state.clearCheckedConfirm
                      ? `<button id="confirm-clear-checked-btn" class="px-3.5 py-2 rounded-xl bg-rose-600 text-white text-xs font-semibold">Confirmer suppression (${checkedCount})</button>
                         <button id="cancel-clear-checked-btn" class="px-3 py-2 rounded-xl bg-stone-100 text-stone-600 text-xs font-semibold">Annuler</button>`
                      : `<button id="ask-clear-checked-btn" class="px-3.5 py-2 rounded-xl bg-stone-100 hover:bg-rose-50 hover:text-rose-700 text-stone-700 text-xs sm:text-sm font-semibold transition-colors">Vider le panier (${checkedCount})</button>`
                    : ''
                }
              </div>
            </div>

            <!-- Jauge -->
            <div class="mt-4 w-full h-2.5 bg-stone-100 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-600 transition-all duration-300 rounded-full" style="width: ${progressPct}%"></div>
            </div>

            <!-- Formulaire ajout rapide -->
            <form id="quick-grocery-form" class="mt-4 grid grid-cols-1 sm:grid-cols-12 gap-2.5">
              <input
                type="text"
                id="grocery-name-input"
                placeholder="Ajouter un article (ex: Café, Papier toilette, Pommes...)"
                required
                class="sm:col-span-5 px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-sm"
              />
              <input
                type="text"
                id="grocery-qty-input"
                placeholder="Quantité (ex: 1 kg, 2)"
                class="sm:col-span-3 px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-sm"
              />
              <select
                id="grocery-cat-input"
                class="sm:col-span-2 px-3 py-2.5 rounded-xl border border-stone-300 bg-white focus:border-emerald-500 outline-none text-sm"
              >
                ${GROCERY_CATEGORIES.map((c) => `<option value="${c}">${c}</option>`).join('')}
              </select>
              <button
                type="submit"
                class="sm:col-span-2 px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm transition-colors"
              >
                + Ajouter
              </button>
            </form>

            <!-- Filtres -->
            <div class="mt-4 flex items-center gap-2">
              <button data-gfilter="all" class="gfilter-btn px-3 py-1.5 rounded-lg text-xs font-semibold ${state.groceryFilter === 'all' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-600'}">Tous (${total})</button>
              <button data-gfilter="todo" class="gfilter-btn px-3 py-1.5 rounded-lg text-xs font-semibold ${state.groceryFilter === 'todo' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-600'}">À acheter (${todoCount})</button>
              <button data-gfilter="done" class="gfilter-btn px-3 py-1.5 rounded-lg text-xs font-semibold ${state.groceryFilter === 'done' ? 'bg-stone-900 text-white' : 'bg-stone-100 text-stone-600'}">Dans le panier (${checkedCount})</button>
            </div>
          </div>

          <!-- Rayons -->
          ${
            categoriesHTML
              ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${categoriesHTML}</div>`
              : `<div class="bg-white rounded-2xl border border-stone-200/80 p-10 text-center">
                   <p class="text-stone-500 text-sm">Votre liste de courses est vide pour ce filtre.</p>
                   <p class="text-xs text-stone-400 mt-1">Ajoutez un article ci-dessus ou importez les ingrédients depuis votre Semainier.</p>
                 </div>`
          }
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // VUE 3 : LIVRE DE RECETTES & MES PLATS PERSONNALISÉS
    // -------------------------------------------------------------------------
    function renderRecipesView() {
      const queryStr = state.recipeSearch.toLowerCase().trim();
      const existingTitleSet = new Set(state.recipes.map((r) => r.title.toLowerCase().trim()));
      const missingStarterCount = STARTER_RECIPES.filter((r) => !existingTitleSet.has(r.title.toLowerCase().trim())).length;

      const filteredRecipes = state.recipes.filter((r) => {
        const matchesCat = state.recipeCategoryFilter === 'Toutes' || r.category === state.recipeCategoryFilter;
        const matchesQuery =
          !queryStr ||
          r.title.toLowerCase().includes(queryStr) ||
          (r.ingredients || []).some((ing) => ing.name.toLowerCase().includes(queryStr));
        return matchesCat && matchesQuery;
      });

      return `
        <div class="space-y-5 animate-fade-up">
          <!-- En-tête Recettes -->
          <div class="bg-white rounded-2xl border border-stone-200/80 p-4 sm:p-5 shadow-xs space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-xl font-bold text-stone-900">Mes Recettes & Idées Repas</h2>
                <p class="text-xs sm:text-sm text-stone-500 mt-0.5">${state.recipes.length} plat(s) enregistré(s) dans votre carnet partagé</p>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                ${
                  missingStarterCount > 0
                    ? `<button id="load-starter-pack-btn" class="px-3.5 py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-amber-900 text-xs sm:text-sm font-semibold transition-colors">
                        + Charger mes ${missingStarterCount} plats habituels
                      </button>`
                    : ''
                }
                <button id="open-new-recipe-btn" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold shadow-xs transition-colors flex items-center justify-center gap-2">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" /></svg>
                  <span>Ajouter une recette</span>
                </button>
              </div>
            </div>

            <!-- Recherche & Filtres par catégorie -->
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5">
              <div class="sm:col-span-8 relative">
                <input
                  type="text"
                  id="recipe-search-input"
                  value="${escapeHTML(state.recipeSearch)}"
                  placeholder="Rechercher un plat ou un ingrédient (ex: poulet, lardons, riz...)"
                  class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 outline-none text-sm"
                />

    // -------------------------------------------------------------------------
    // VUE 4 : HISTORIQUE & SUIVI DES SEMAINES PRÉCÉDENTES
    // -------------------------------------------------------------------------
    function renderHistoryView() {
      const todayISO = toISODate(new Date());
      const currentWeekKey = toISODate(currentMonday);

      // Collecter tous les repas enregistrés dans toutes les semaines
      const allWeeks = Object.values(state.mealPlans)
        .filter((plan) => plan && plan.weekKey && plan.slots && Object.keys(plan.slots).length > 0)
        .sort((a, b) => b.weekKey.localeCompare(a.weekKey));

      // Statistiques de fréquence par plat
      const dishStatsMap = new Map();
      let totalLoggedMeals = 0;

      allWeeks.forEach((plan) => {
        Object.entries(plan.slots).forEach(([slotKey, meal]) => {
          const dateISO = slotKey.split('_')[0];
          if (dateISO <= todayISO && meal.title) {
            totalLoggedMeals++;
            const key = meal.title.toLowerCase().trim();
            const existing = dishStatsMap.get(key) || {
              title: meal.title,
              count: 0,
              lastDateISO: dateISO
            };
            existing.count++;
            if (dateISO > existing.lastDateISO) {
              existing.lastDateISO = dateISO;
              existing.title = meal.title;
            }
            dishStatsMap.set(key, existing);
          }
        });
      });

      const sortedStats = Array.from(dishStatsMap.values()).sort((a, b) => {
        if (b.count !== a.count) return b.count - a.count;
        return b.lastDateISO.localeCompare(a.lastDateISO);
      });

      return `
        <div class="space-y-5 animate-fade-up">
          <!-- En-tête & Compteurs clés -->
          <div class="bg-white rounded-2xl border border-stone-200/80 p-4 sm:p-5 shadow-xs">
            <h2 class="text-xl font-bold text-stone-900">Historique & Traçabilité des repas</h2>
            <p class="text-xs sm:text-sm text-stone-500 mt-0.5">Retrouvez tout ce que vous avez mangé les semaines précédentes pour varier vos menus.</p>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">
              <div class="p-3.5 rounded-xl bg-stone-50 border border-stone-200/70">
                <p class="text-xs text-stone-500">Repas tracés</p>
                <p class="text-2xl font-extrabold text-stone-900 mt-0.5">${totalLoggedMeals}</p>
              </div>
              <div class="p-3.5 rounded-xl bg-stone-50 border border-stone-200/70">
                <p class="text-xs text-stone-500">Plats différents cuisinés</p>
                <p class="text-2xl font-extrabold text-emerald-700 mt-0.5">${sortedStats.length}</p>
              </div>
              <div class="col-span-2 sm:col-span-1 p-3.5 rounded-xl bg-stone-50 border border-stone-200/70">
                <p class="text-xs text-stone-500">Semaines archivées</p>
                <p class="text-2xl font-extrabold text-stone-900 mt-0.5">${allWeeks.length}</p>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
            <!-- Colonne gauche : Chronologie des semaines -->
            <div class="lg:col-span-7 space-y-4">
              <h3 class="text-sm font-bold uppercase tracking-wider text-stone-500 px-1">Semaines enregistrées</h3>

              ${
                allWeeks.length > 0
                  ? allWeeks
                      .map((plan) => {
                        const mondayObj = new Date(plan.weekKey + 'T12:00:00');
                        const diffWeeks = Math.round((mondayObj - currentMonday) / (1000 * 60 * 60 * 24 * 7));
                        const entries = Object.entries(plan.slots).sort((a, b) => a[0].localeCompare(b[0]));

                        return `
                          <div class="bg-white rounded-2xl border border-stone-200/80 p-4 sm:p-5 shadow-xs space-y-3">
                            <div class="flex items-center justify-between gap-2">
                              <div>
                                <span class="text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                                  plan.weekKey === currentWeekKey
                                    ? 'bg-emerald-100 text-emerald-800'
                                    : 'bg-stone-100 text-stone-700'
                                }">${getRelativeWeekLabel(diffWeeks)}</span>
                                <h4 class="text-base font-bold text-stone-900 mt-1">${formatWeekRange(mondayObj)}</h4>
                              </div>
                              <button
                                data-action="jump-to-week"
                                data-offset="${diffWeeks}"
                                class="px-3 py-1.5 rounded-xl bg-stone-100 hover:bg-emerald-600 hover:text-white text-xs font-semibold text-stone-700 transition-colors"
                              >
                                Ouvrir →
                              </button>
                            </div>

                            <ul class="divide-y divide-stone-100">
                              ${entries
                                .map(([slotKey, meal]) => {
                                  const [dISO, period] = slotKey.split('_');
                                  const dObj = new Date(dISO + 'T12:00:00');
                                  const dayIdx = (dObj.getDay() + 6) % 7;
                                  return `
                                    <li class="py-2 flex items-center justify-between gap-2 text-xs sm:text-sm">
                                      <div class="flex items-center gap-2 min-w-0">
                                        <span class="font-semibold text-stone-500 w-24 shrink-0">${DAYS_FR[dayIdx]} ${period === 'midi' ? 'Midi' : 'Soir'}</span>
                                        <span class="font-medium text-stone-900 truncate">${escapeHTML(meal.title)}</span>
                                      </div>
                                      ${
                                        meal.cooked
                                          ? '<span class="text-[11px] font-semibold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md shrink-0">Mangé ✓</span>'
                                          : '<span class="text-[11px] text-stone-400 shrink-0">Prévu</span>'
                                      }
                                    </li>
                                  `;
                                })
                                .join('')}
                            </ul>
                          </div>
                        `;
                      })
                      .join('')
                  : `<div class="bg-white rounded-2xl border border-stone-200/80 p-8 text-center text-sm text-stone-500">
                      Aucun historique disponible pour le moment. Commencez par planifier vos repas dans le Semainier !
                    </div>`
              }
            </div>

            <!-- Colonne droite : Palmarès & dernière dégustation -->
            <div class="lg:col-span-5 space-y-4">
              <h3 class="text-sm font-bold uppercase tracking-wider text-stone-500 px-1">Fréquence des plats</h3>
              <div class="bg-white rounded-2xl border border-stone-200/80 p-4 sm:p-5 shadow-xs">
                ${
                  sortedStats.length > 0
                    ? `<ul class="divide-y divide-stone-100">
                        ${sortedStats
                          .map((st) => {
                            const lastObj = new Date(st.lastDateISO + 'T12:00:00');
                            return `
                              <li class="py-2.5 flex items-center justify-between gap-3">
                                <div class="min-w-0">
                                  <p class="text-sm font-semibold text-stone-900 truncate">${escapeHTML(st.title)}</p>
                                  <p class="text-[11px] text-stone-400">Dernière fois : ${formatShortDate(lastObj)}</p>
                                </div>
                                <span class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 text-xs font-bold shrink-0">${st.count}×</span>
                              </li>
                            `;
                          })
                          .join('')}
                      </ul>`
                    : `<p class="text-xs text-stone-400 text-center py-6">Vos statistiques apparaîtront ici dès vos premiers repas enregistrés.</p>`
                }
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 9. MODALES (CHOIX DE REPAS, ÉDITEUR DE RECETTE, SYNC & GITHUB)
    // =========================================================================
    function renderPickerRecipeItems(query = '') {
      const q = query.toLowerCase().trim();
      const matches = state.recipes.filter(
        (r) =>
          !q ||
          r.title.toLowerCase().includes(q) ||
          (r.category || '').toLowerCase().includes(q) ||
          (r.ingredients || []).some((ing) => ing.name.toLowerCase().includes(q))
      );

      if (matches.length === 0) {
        return `<p class="text-xs text-stone-400 text-center py-6">Aucune recette trouvée pour « ${escapeHTML(query)} ».</p>`;
      }

      return matches
        .map((r) => {
          const hist = getRecipeLastEatenInfo(r.id, r.title);
          return `
            <button
              type="button"
              data-action="select-picker-recipe"
              data-id="${r.id}"
              class="w-full text-left p-3 rounded-xl border border-stone-200/80 hover:border-emerald-500 hover:bg-emerald-50/50 transition-all flex items-center justify-between gap-3"
            >
              <div class="min-w-0">
                <p class="text-sm font-semibold text-stone-900 truncate">${escapeHTML(r.title)}</p>
                <p class="text-[11px] text-stone-500 mt-0.5">
                  ${escapeHTML(r.category || 'Plat familial')} · ⏱ ${r.prepTime || 20} min ·
                  <span class="${hist.count > 0 ? 'text-emerald-700 font-medium' : 'text-stone-400'}">${hist.label}</span>
                </p>
              </div>
              <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 text-xs font-semibold shrink-0">Choisir</span>
            </button>
          `;
        })
        .join('');
    }

    function openMealPickerModal(weekKey, slotKey, periodLabel) {
      const currentMeal = state.mealPlans[weekKey]?.slots?.[slotKey] || null;
      const dateISO = slotKey.split('_')[0];
      const dateObj = new Date(dateISO + 'T12:00:00');
      const dayName = DAYS_FR[(dateObj.getDay() + 6) % 7] || '';

      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `

              </div>
              <button id="close-modal-btn" class="p-2 rounded-xl bg-stone-100 hover:bg-stone-200 text-stone-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>

            <div class="p-5 overflow-y-auto space-y-4">

                <label class="block text-xs font-bold uppercase tracking-wider text-stone-500">Plat libre ou reste</label>
                <div class="flex gap-2">
                  <input
                    type="text"
                    id="custom-meal-input"
                    value="${escapeHTML(currentMeal?.title || '')}"
                    placeholder="Ex: Restes de pâtes, Omelette, Restaurant..."
                    class="flex-1 px-3.5 py-2.5 rounded-xl border border-stone-300 focus:border-emerald-500 outline-none text-sm"
                  />
                  <button type="submit" class="px-4 py-2.5 rounded-xl bg-stone-900 hover:bg-stone-800 text-white text-xs font-semibold shrink-0">
                    Valider
                  </button>
                </div>
              </form>

              <div class="space-y-2.5 pt-2 border-t border-stone-100">
                <label class="block text-xs font-bold uppercase tracking-wider text-stone-500">Ou choisir parmi mes recettes (${state.recipes.length})</label>
                <input
                  type="text"
                  id="picker-search-input"
                  placeholder="Filtrer mes recettes..."
                  class="w-full px-3.5 py-2 rounded-xl border border-stone-300 focus:border-emerald-500 outline-none text-sm"
                />
                <div id="picker-recipes-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                  ${renderPickerRecipeItems('')}
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      const bindRecipeSelectButtons = () => {
        document.querySelectorAll('[data-action="select-picker-recipe"]').forEach((btn) => {
          btn.onclick = async () => {
            const rec = state.recipes.find((r) => r.id === btn.dataset.id);
            if (!rec) return;
            await saveMealSlot(weekKey, slotKey, {
              recipeId: rec.id,
              title: rec.title,
              cooked: currentMeal?.cooked || false
            });
            closeModal();
          };
        });
      };

      document.getElementById('close-modal-btn').onclick = closeModal;
      document.getElementById('modal-backdrop').onclick = (e) => {
        if (e.target.id === 'modal-backdrop') closeModal();
      };

      document.getElementById('custom-meal-form').onsubmit = async (e) => {
        e.preventDefault();
        const title = document.getElementById('custom-meal-input').value.trim();
        if (!title) return;
        await saveMealSlot(weekKey, slotKey, {
          recipeId: currentMeal?.title === title ? currentMeal.recipeId || null : null,
          title,
          cooked: currentMeal?.cooked || false
        });
        closeModal();
      };

      document.getElementById('picker-search-input').oninput = (e) => {
        document.getElementById('picker-recipes-list').innerHTML = renderPickerRecipeItems(e.target.value);
        bindRecipeSelectButtons();
      };

      bindRecipeSelectButtons();
    }

          ]
        };

        const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
        const manifestUrl = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);

        window.addEventListener('beforeinstallprompt', (e) => {

        console.warn('Manifest PWA non initialisé:', err);

    }

        state.clearCheckedConfirm = false;
        renderApp();
      });
      document.getElementById('confirm-clear-checked-btn')?.addEventListener('click', async () => {
        state.clearCheckedConfirm = false;
        await clearCheckedGroceries();
      });
    }

    function bindRecipesEvents() {
      document.getElementById('load-starter-pack-btn')?.addEventListener('click', () => loadUserStarterPack(false));
      document.getElementById('open-new-recipe-btn')?.addEventListener('click', () => openRecipeEditorModal());
      document.getElementById('empty-add-recipe-btn')?.addEventListener('click', () => openRecipeEditorModal());

      const searchInput = document.getElementById('recipe-search-input');
      searchInput?.addEventListener('input', () => {
        state.recipeSearch = searchInput.value;
        const pos = searchInput.selectionStart;
        renderApp();
        const newSearch = document.getElementById('recipe-search-input');
        if (newSearch) {
          newSearch.focus();
          newSearch.setSelectionRange(pos, pos);
        }
      });

      document.getElementById('recipe-cat-filter')?.addEventListener('change', (e) => {
        state.recipeCategoryFilter = e.target.value;
        renderApp();
      });

      document.querySelectorAll('[data-action="quick-plan-recipe"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const rec = state.recipes.find((r) => r.id === btn.dataset.id);
          if (rec) openQuickPlanRecipeModal(rec);
        });
      });

      document.querySelectorAll('[data-action="edit-recipe"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const rec = state.recipes.find((r) => r.id === btn.dataset.id);
          if (rec) openRecipeEditorModal(rec);
        });
      });

      document.querySelectorAll('[data-action="ask-delete-recipe"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.deleteConfirmId = btn.dataset.id;
          renderApp();
        });
      });

      document.querySelectorAll('[data-action="cancel-delete-recipe"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.deleteConfirmId = null;
          renderApp();
        });
      });

      document.querySelectorAll('[data-action="confirm-delete-recipe"]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          state.deleteConfirmId = null;
          await deleteRecipe(id);
        });
      });
    }

    function bindHistoryEvents() {
      document.querySelectorAll('[data-action="jump-to-week"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.weekOffset = Number(btn.dataset.offset) || 0;
          state.activeTab = 'planner';
          renderApp();
        });
      });
    }

    // =========================================================================
    // 11. DÉMARRAGE DE L'APPLICATION
    // =========================================================================
    document.querySelectorAll('[data-tab]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        state.deleteConfirmId = null;
        state.clearCheckedConfirm = false;
        renderApp();
      });
    });

    document.getElementById('open-sync-btn')?.addEventListener('click', openSyncAndGithubModal);
    document.getElementById('open-install-btn')?.addEventListener('click', openMobileInstallModal);

    // Rendu initial immédiat puis connexion Cloud
    initPWASupport();
    renderApp();
    initCloudSync();
  </script>
</body>
</html>
